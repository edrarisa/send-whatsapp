# Despliegue en Coolify (o docker compose a secas).
#
# El enviador no envia nada al arrancar: se queda vivo y el envio se dispara
# como tarea programada. Asi se controla CUANDO sale la campana, en vez de que
# se dispare sola en cada redespliegue.
#
#   docker compose exec enviador python enviar.py --config /datos/campana.json --dry-run
#
services:
  enviador:
    build: .
    container_name: send-whatsapp
    restart: unless-stopped

    # Vigila las ordenes que deja el panel en el volumen compartido. Lanzarlo
    # a mano con 'docker exec ... python enviar.py' sigue funcionando igual.
    command: python vigilante.py

    environment:
      TZ: America/Bogota
      # Estas se configuran en el panel de Coolify, no aqui.
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID}
      GRAPH_API_VERSION: ${GRAPH_API_VERSION:-v21.0}
      RUTA_ORDENES: /datos/ordenes
      RUTA_CAMPANA: /datos/campana.json

    volumes:
      # Persistente a proposito. Si esto fuera efimero, cada redespliegue
      # borraria el log y la siguiente corrida reenviaria a TODA la lista.
      - datos:/datos

  # Sube la lista de contactos y nada mas.
  #
  # Fijate en lo que NO tiene: ni WHATSAPP_TOKEN ni WHATSAPP_PHONE_NUMBER_ID.
  # Aunque alguien entre al panel, no puede enviar mensajes ni gastar dinero.
  panel:
    build: .
    container_name: send-whatsapp-panel
    restart: unless-stopped

    # El servidor de desarrollo de Flask no debe exponerse a internet.
    command: >
      gunicorn --bind 0.0.0.0:8000 --workers 1 --timeout 120
      "src.panel:crear_app()"

    environment:
      TZ: America/Bogota
      PANEL_PASSWORD_HASH: ${PANEL_PASSWORD_HASH}
      PANEL_SECRET_KEY: ${PANEL_SECRET_KEY}
      PANEL_DESTINO: /datos/entrada/contactos.xlsx
      PANEL_LOG: /datos/logs/envios.csv
      PANEL_ORDENES: /datos/ordenes

    # 'expose' y no 'ports': el panel queda alcanzable solo desde el proxy de
    # Coolify, que es quien pone el HTTPS. Con 'ports' se publicaria ademas en
    # un puerto del host, accesible sin cifrado y saltandose el proxy.
    expose:
      - "8000"

    volumes:
      - datos:/datos

volumes:
  datos:
